name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Fixed signing key (same certificate on every APK so updates install
    # over the previous one). android/app/build.gradle.kts decodes the
    # base64 keystore to a temp file; without these secrets the build falls
    # back to the debug key.
    env:
      NEOVARCH_KEYSTORE_BASE64: ${{ secrets.NEOVARCH_KEYSTORE_BASE64 }}
      NEOVARCH_KEYSTORE_PASSWORD: ${{ secrets.NEOVARCH_KEYSTORE_PASSWORD }}
      NEOVARCH_KEY_ALIAS: ${{ secrets.NEOVARCH_KEY_ALIAS }}
      NEOVARCH_KEY_PASSWORD: ${{ secrets.NEOVARCH_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Targeted unit tests for the phone logic touched in 1.4.7 (the full
      # suite is not gated yet). Add files here as they are kept green.
      - name: Unit tests (targeted)
        run: flutter test test/voice_fallback_test.dart test/message_queue_test.dart test/pc_restart_test.dart test/markdown_table_test.dart test/mascot_avatar_test.dart test/resume_last_session_test.dart test/multi_attach_test.dart

      - name: Build APK (release, per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build APK (release, universal)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neovarch-agent-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
