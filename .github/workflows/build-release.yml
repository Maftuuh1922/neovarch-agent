name: Build release (Android, npm launcher)

# Flutter builds only the Android phone app (the remote). The desktop app is
# Electron and is built by desktop-electron.yml, which attaches its installers
# to the same release when a v* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  # Fallback for workflow_dispatch; a v* tag push uses the tag's version.
  APP_VERSION: '1.4.8'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Fixed signing key (same certificate on every APK so updates install
    # over the previous one). android/app/build.gradle.kts decodes the
    # base64 keystore to a temp file; without these secrets the build falls
    # back to the debug key.
    env:
      NEOVARCH_KEYSTORE_BASE64: ${{ secrets.NEOVARCH_KEYSTORE_BASE64 }}
      NEOVARCH_KEYSTORE_PASSWORD: ${{ secrets.NEOVARCH_KEYSTORE_PASSWORD }}
      NEOVARCH_KEY_ALIAS: ${{ secrets.NEOVARCH_KEY_ALIAS }}
      NEOVARCH_KEY_PASSWORD: ${{ secrets.NEOVARCH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Signing key in use
        run: |
          if [ -n "$NEOVARCH_KEYSTORE_BASE64" ] && [ -n "$NEOVARCH_KEYSTORE_PASSWORD" ] && [ -n "$NEOVARCH_KEY_ALIAS" ]; then
            echo "Signing: fixed Neovarch key from repository secrets"
          else
            echo "::warning::Signing: NEOVARCH_KEYSTORE_* secrets missing, falling back to the debug key"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/neovarch-agent-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/neovarch-agent-android-arm64.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$apksigner" ]; then
            for f in dist/*.apk; do echo "$f"; "$apksigner" verify --print-certs "$f" | grep -E 'SHA-256|DN' || true; done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: neovarch-agent-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Version from tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Pack npm launcher
        run: |
          cd npm
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npm pack
          mv "neovarch-agent-$APP_VERSION.tgz" ../artifacts/neovarch-agent-npm.tgz

      - run: ls -la artifacts

      - name: Release notes
        run: |
          # Per-release notes live in docs/release-notes/v<version>.md.
          f="docs/release-notes/v${APP_VERSION}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else printf 'Neovarch Agent %s\n' "$APP_VERSION" > notes.md; fi
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RELEASE_KEY: ${{ secrets.NEOVARCH_KEYSTORE_BASE64 != '' }}
        run: |
          # A debug-signed APK must never reach a release: it cannot update over the
          # release-signed app. Without the signing secrets the APKs are left out and
          # the release-signed APK is attached separately.
          if [ "$HAS_RELEASE_KEY" != "true" ]; then
            echo "::warning::NEOVARCH_KEYSTORE_* secrets missing: APKs are debug-signed, not attached"
            rm -f artifacts/*.apk
          fi
          TAG="v${APP_VERSION}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; fi
          TARGET_FLAG=""
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then TARGET_FLAG="--target $GITHUB_SHA"; fi
          # desktop-electron.yml attaches to the same tag; whichever job gets there first creates it.
          for i in 1 2 3 4 5; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $TARGET_FLAG --title "Neovarch Agent ${APP_VERSION}" \
              --notes-file notes.md >/dev/null 2>&1 && break
            sleep 10
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Neovarch Agent ${APP_VERSION}" \
            --notes-file notes.md --latest --draft=false
          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
